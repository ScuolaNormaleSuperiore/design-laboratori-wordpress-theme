<script src="{{ '/assets/vendor/bootstrap-italia/js/bootstrap-italia.bundle.min.js' | relative_url }}"></script>
<script>
  (() => {
    const headings = Array.from(document.querySelectorAll('.dli-content h2[id], .dli-content h3[id]'));
    const links = Array.from(document.querySelectorAll('.dli-toc a[href^="#"], .dli-mobile-toc a[href^="#"]'));
    if (!headings.length || !links.length || !('IntersectionObserver' in window)) return;

    const setActive = (id) => {
      links.forEach((link) => link.classList.toggle('is-active', link.getAttribute('href') === `#${id}`));
    };

    const observer = new IntersectionObserver((entries) => {
      const visible = entries.filter((entry) => entry.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
      if (visible[0]) setActive(visible[0].target.id);
    }, { rootMargin: '-15% 0px -70% 0px', threshold: 0 });

    headings.forEach((heading) => observer.observe(heading));
  })();
</script>
<script>
  (() => {
    const toggle = document.querySelector('[data-dli-search-toggle]');
    const panel = document.getElementById('dli-search-panel');
    const input = document.getElementById('dli-search-input');
    const results = document.getElementById('dli-search-results');
    if (!toggle || !panel || !input || !results) return;
    let index = null;
    const searchUrl = '{{ "/assets/search-index.json" | relative_url }}';
    toggle.addEventListener('click', async () => {
      panel.hidden = !panel.hidden;
      toggle.setAttribute('aria-expanded', String(!panel.hidden));
      if (!panel.hidden) {
        if (!index) index = await fetch(searchUrl).then((response) => response.ok ? response.json() : []);
        input.focus();
      }
    });
    input.addEventListener('input', () => {
      const query = input.value.trim().toLocaleLowerCase('it');
      if (query.length < 2) { results.replaceChildren(); return; }
      const matches = (index || []).filter((entry) => `${entry.title} ${entry.description} ${entry.text}`.toLocaleLowerCase('it').includes(query)).slice(0, 8);
      results.replaceChildren(...matches.map((entry) => {
        const link = document.createElement('a');
        link.className = 'd-block py-2'; link.href = entry.url; link.textContent = entry.title;
        return link;
      }));
      if (!matches.length) results.textContent = 'Nessun risultato.';
    });
  })();
</script>
