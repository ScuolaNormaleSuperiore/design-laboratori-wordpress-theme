name: E2E tests

# The E2E suite (Playwright) in the wp-env E2E environment (.wp-env.e2etest.json), with the same npm script
# used locally (see tests/e2e/README.md). Started by hand from the Actions tab (Run workflow): it is long, and
# it is observational like the CI. GitHub offers Run workflow only for the workflow files of the default branch.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E tests (Playwright, Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install the test tools and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Starts the environment, restores the baseline (global setup) and runs the suite.
      - name: E2E suite in the wp-env E2E environment
        run: npm run test:e2e

      - name: Keep the report and the traces of the failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 7

      - name: Stop the environment
        if: always()
        run: npm run env:stop
