name: Documentation check

on:
  push:
    branches: [dev, 'docs/**']
    paths:
      - 'DOC/**'
      - 'SETUP/Documentazione/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/documentation-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'DOC/**'
      - 'SETUP/Documentazione/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/documentation-check.yml'

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: '4.0.9'
          bundler: '4.0.23'
          working-directory: SETUP/Documentazione
      - run: bundle _4.0.23_ install --jobs 4 --retry 3
        working-directory: SETUP/Documentazione
      - run: npm ci
      - run: npm run docs:build
      - run: npm run docs:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-preview
          path: build/documentazione
          if-no-files-found: error
