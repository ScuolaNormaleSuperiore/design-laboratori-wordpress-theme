name: Documentation check

on:
  push:
    branches: [dev, 'docs/**']
    paths:
      - 'DOC/**'
      - 'SETUP/Documentazione/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/documentation-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'DOC/**'
      - 'SETUP/Documentazione/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/documentation-check.yml'

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '4.0.9'
          bundler: '4.0.23'
          working-directory: SETUP/Documentazione
      - run: bundle _4.0.23_ install --jobs 4 --retry 3
        working-directory: SETUP/Documentazione
      - run: npm ci
      - run: npm run docs:build
      - run: npm run docs:check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-preview
          path: build/documentazione
          if-no-files-found: error
