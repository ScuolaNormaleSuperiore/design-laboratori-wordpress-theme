name: CI

# Safety net of the local pre-commit hook: the same checks on a clean machine, plus PHP 8.0, the
# declared minimum, and the integration tests, which the hook does not run. Observational: a failure
# turns the run red but blocks nothing.
# Checks and triggers are described in AGENTS/ARCHITECTURE.md (CI, GitHub Actions).

on:
  push:
    branches: [dev, main, 'features/**', 'bugfix/**', 'refactor/**', 'docs/**']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.4']
    env:
      # A push gives the commit before the push, a pull request the tip of its target branch;
      # a manual run gives neither, and the scripts then look at the last commit.
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Check 6: sanity. The syntax check runs on both PHP versions, the declared minimum included.
      - name: PHP syntax
        run: |
          git ls-files '*.php' | grep -v -E '^(inc/vendor|vendor|node_modules)/' \
            | xargs -n1 -P4 php -l > "$RUNNER_TEMP/php-lint.log" 2>&1 \
            || { grep -v '^No syntax errors' "$RUNNER_TEMP/php-lint.log"; exit 1; }

      - name: Conflict markers
        if: matrix.php == '8.4'
        run: "! git grep -n -E '^(<<<<<<< |>>>>>>> )' -- '*.php' '*.js' '*.css' '*.scss' ':!inc/vendor' ':!assets/js/components'"

      - name: Whitespace errors in the changed code
        if: matrix.php == '8.4'
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse --verify --quiet 'HEAD~1' || true)"
          fi
          if [ -z "$base" ]; then
            echo "No base commit: nothing to compare."
            exit 0
          fi
          git diff --check "${base}...HEAD" -- '*.php' '*.js' '*.css' '*.scss' ':!inc/vendor' ':!assets/js/components'

      # Check 7: unit tests (PHPUnit, no WordPress), on both PHP versions.
      - name: Unit tests
        run: composer test:unit

      # Check 8: PHPCS, errors only, on the PHP, CSS and SCSS files changed.
      - name: PHPCS on the changed files
        if: matrix.php == '8.4'
        run: bash .github/scripts/phpcs-changed.sh "$BASE_SHA"

      # Check 9: PHPStan on the whole theme, at the level set in phpstan.neon (5).
      - name: PHPStan level 5
        if: matrix.php == '8.4'
        run: composer run lint:phpstan

  # Check 10: integration tests, on a real WordPress with ACF and Polylang and a throwaway database.
  # The slowest and noisiest job, so it does not run on the prefixed branches nor on pull requests
  # to dev (the ones of Dependabot); a manual run can start it on any branch.
  integration:
    name: Integration tests (PHP 8.4)
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))
      || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Throwaway database of this job only, with no password and not reachable from outside the runner.
      # The test suite refuses any database name other than dli_wordpress_test.
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: dli_wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # Versions are pinned so that a run can be repeated: change them here, on purpose, to update.
      WP_TESTS_REF: '7.1.4'
      WP_TESTS_SHA: '0afb74de8c3fe4c1869e44b62b0418d67b11aa4c'
      DLI_ACF_VERSION: '6.8.10'
      DLI_POLYLANG_VERSION: '3.9.1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mysqli, zip, gd, intl, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # The WordPress test framework, at a tag whose commit is checked: a moved tag stops the run.
      - name: Prepare the WordPress test suite
        run: |
          # The runner context is not available in the env of a job, so the paths are set here for the next steps.
          echo "WP_TESTS_DIR=$RUNNER_TEMP/wordpress-develop/tests/phpunit" >> "$GITHUB_ENV"
          echo "WP_TESTS_CONFIG_FILE_PATH=$RUNNER_TEMP/wordpress-develop/wp-tests-config.php" >> "$GITHUB_ENV"
          WP_TESTS_CONFIG_FILE_PATH="$RUNNER_TEMP/wordpress-develop/wp-tests-config.php"
          git clone --depth 1 --branch "$WP_TESTS_REF" https://github.com/WordPress/wordpress-develop.git "$RUNNER_TEMP/wordpress-develop"
          actual="$(git -C "$RUNNER_TEMP/wordpress-develop" rev-parse HEAD)"
          if [ "$actual" != "$WP_TESTS_SHA" ]; then
            echo "wordpress-develop $WP_TESTS_REF is at $actual, expected $WP_TESTS_SHA."
            exit 1
          fi
          sed -e "s/youremptytestdbnamehere/dli_wordpress_test/" \
              -e "s/yourusernamehere/root/" \
              -e "s/yourpasswordhere//" \
              -e "s/'localhost'/'127.0.0.1:3306'/" \
              "$RUNNER_TEMP/wordpress-develop/wp-tests-config-sample.php" > "$WP_TESTS_CONFIG_FILE_PATH"
          grep -E "DB_(NAME|USER|HOST)'" "$WP_TESTS_CONFIG_FILE_PATH"

      # Downloads ACF and Polylang at the pinned versions (support/fetch-test-plugins.php), then runs PHPUnit.
      - name: Integration tests
        run: composer test:integration
