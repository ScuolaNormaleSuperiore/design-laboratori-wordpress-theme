name: CI

# Safety net of the local pre-commit hook: the same checks on a clean machine, plus PHP 8.0, the
# declared minimum, and the integration tests, which the hook does not run. Observational: a failure
# turns the run red but blocks nothing.
# Checks and triggers are described in AGENTS/ARCHITECTURE.md (CI, GitHub Actions).

on:
  push:
    branches: [dev, main, 'features/**', 'bugfix/**', 'refactor/**', 'docs/**']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.4']
    env:
      # A push gives the commit before the push, a pull request the tip of its target branch;
      # a manual run gives neither, and the scripts then look at the last commit.
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Set up Node for the JavaScript unit tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Validate the project schema and the lock file before installing anything.
      # Packagist publication metadata is not required for this theme repository.
      - name: Validate Composer configuration and lock file
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Check 6: sanity. The syntax check runs on both PHP versions, the declared minimum included.
      - name: PHP syntax
        run: |
          git ls-files '*.php' | grep -v -E '^(inc/vendor|vendor|node_modules)/' \
            | xargs -n1 -P4 php -l > "$RUNNER_TEMP/php-lint.log" 2>&1 \
            || { grep -v '^No syntax errors' "$RUNNER_TEMP/php-lint.log"; exit 1; }

      - name: Conflict markers
        if: matrix.php == '8.4'
        run: "! git grep -n -E '^(<<<<<<< |>>>>>>> )' -- '*.php' '*.js' '*.css' '*.scss' ':!inc/vendor' ':!assets/js/components'"

      - name: Whitespace errors in the changed code
        if: matrix.php == '8.4'
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse --verify --quiet 'HEAD~1' || true)"
          fi
          if [ -z "$base" ]; then
            echo "No base commit: nothing to compare."
            exit 0
          fi
          git diff --check "${base}...HEAD" -- '*.php' '*.js' '*.css' '*.scss' ':!inc/vendor' ':!assets/js/components'

      # Check 7: unit tests (PHPUnit, no WordPress), on both PHP versions.
      - name: Unit tests
        run: composer test:unit

      # Check 8: PHPCS, errors only, on the PHP, CSS and SCSS files changed.
      - name: PHPCS on the changed files
        if: matrix.php == '8.4'
        run: bash .github/scripts/phpcs-changed.sh "$BASE_SHA"

      # Check 9: PHPStan on the whole theme, at the level set in phpstan.neon (6).
      - name: PHPStan level 6
        if: matrix.php == '8.4'
        run: composer run lint:phpstan

  composer-audit:
    name: Composer dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Audit locked Composer dependencies
        run: composer audit --locked

  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Include development tools as well as runtime dependencies; do not install or fix packages.
      # Moderate findings remain visible, while high and critical findings fail this job.
      - name: Audit locked npm dependencies
        run: npm audit --package-lock-only --include=dev --audit-level=high

  # Check 10: integration tests in Docker (wp-env test environment, .wp-env.inttest.json), with the same npm
  # script used locally: WordPress, PHP, ACF and Polylang at the versions pinned in that file, and a throwaway
  # database inside the environment. The slowest job, so it does not run on the prefixed branches nor on
  # pull requests to dev (the ones of Dependabot); a manual run can start it on any branch.
  integration:
    name: Integration tests (PHP 8.4)
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))
      || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      # PHPUnit comes from vendor/, which the container reads from the working copy.
      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Integration tests in the wp-env test environment
        run: npm run test:integration

      - name: Stop the environment
        if: always()
        run: npm run env:tests:stop

  # Check 11: publiccode.yml, the file of the catalogue of Developers Italia, validated with the official
  # action (it builds its own image). It also checks the remote URLs and the logo and screenshots on the
  # default branch, so a file added on dev is found only after the merge on main.
  publiccode:
    name: publiccode.yml
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate publiccode.yml
        uses: italia/publiccode-parser-action@f370d239aa3ec57b819909b467ff77679b6dc721 # v1.7.0
        with:
          publiccode: publiccode.yml

  # Check 12: actionlint on the workflows (syntax, expressions, contexts and, with shellcheck, the run
  # scripts), from the official image pinned to a digest: nothing is installed on the runner.
  actionlint:
    name: Workflows (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the workflows
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" --workdir /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
