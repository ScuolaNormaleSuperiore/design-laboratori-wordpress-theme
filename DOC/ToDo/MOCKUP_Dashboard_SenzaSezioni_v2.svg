  <text class="labelA" x="1210" y="302">Gestione contenuti</text>
  <text class="item" x="1210" y="327">- Elenco pubblicazioni</text>
  <text class="item" x="1210" y="349">- Aggiungi pubblicazione</text>
  <line class="split" x1="1370" y1="286" x2="1370" y2="440" />
  <text class="labelA" x="1388" y="302">Classificazioni</text>
  <text class="item" x="1388" y="327">- Tag</text>
  <text class="item" x="1388" y="349">- Tipo pubblicazione</text>

  <rect class="panel" x="50" y="475" width="360" height="220" />
  <rect class="head" x="50" y="475" width="360" height="42" />
  <text class="htext" x="70" y="502">Notizie</text>
  <text class="labelA" x="70" y="542">Gestione contenuti</text>
  <text class="item" x="70" y="567">- Elenco notizie</text>
  <text class="item" x="70" y="589">- Aggiungi notizia</text>
  <line class="split" x1="230" y1="526" x2="230" y2="680" />
  <text class="labelA" x="248" y="542">Classificazioni</text>
  <text class="item" x="248" y="567">- Categorie</text>
  <text class="item" x="248" y="589">- Tag</text>

  <rect class="panel" x="430" y="475" width="360" height="220" />
  <rect class="head" x="430" y="475" width="360" height="42" />
