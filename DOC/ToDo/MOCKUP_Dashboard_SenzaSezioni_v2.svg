  <text class="labelA" x="830" y="302">Gestione contenuti</text>
  <text class="item" x="830" y="327">- Elenco progetti</text>
  <text class="item" x="830" y="349">- Aggiungi progetto</text>
  <line class="split" x1="990" y1="286" x2="990" y2="440" />
