  <text class="item" x="450" y="589">- Aggiungi evento</text>
  <line class="split" x1="610" y1="526" x2="610" y2="680" />
  <text class="labelA" x="628" y="542">Classificazioni</text>
  <text class="item" x="628" y="567">- Categorie</text>
  <text class="item" x="628" y="589">- Tag</text>

  <rect class="panel" x="810" y="475" width="360" height="220" />
  <rect class="head" x="810" y="475" width="360" height="42" />
  <text class="htext" x="830" y="502">Brevetti</text>
  <text class="labelA" x="830" y="542">Gestione contenuti</text>
  <text class="item" x="830" y="567">- Elenco brevetti</text>
  <text class="item" x="830" y="589">- Aggiungi brevetto</text>
  <line class="split" x1="990" y1="526" x2="990" y2="680" />
  <text class="labelA" x="1008" y="542">Classificazioni</text>
  <text class="item" x="1008" y="567">- Categorie</text>
  <text class="item" x="1008" y="589">- Tag</text>
  <text class="item" x="1008" y="611">- Area tematica</text>

  <rect class="panel" x="1190" y="475" width="360" height="220" />
  <rect class="head" x="1190" y="475" width="360" height="42" />
  <text class="htext" x="1210" y="502">Luoghi</text>
  <text class="labelA" x="1210" y="542">Gestione contenuti</text>
  <text class="item" x="1210" y="567">- Elenco luoghi</text>
  <text class="item" x="1210" y="589">- Aggiungi luogo</text>
  <line class="split" x1="1370" y1="526" x2="1370" y2="680" />
  <text class="labelA" x="1388" y="542">Classificazioni</text>
  <text class="item" x="1388" y="567">- Tipologia luogo</text>

  <rect class="panel" x="50" y="715" width="360" height="220" />
  <rect class="head" x="50" y="715" width="360" height="42" />
  <text class="htext" x="70" y="742">Spin-off</text>
  <text class="labelA" x="70" y="782">Gestione contenuti</text>
  <text class="item" x="70" y="807">- Elenco spin-off</text>
  <text class="item" x="70" y="829">- Aggiungi spin-off</text>
  <line class="split" x1="230" y1="766" x2="230" y2="920" />
  <text class="labelA" x="248" y="782">Classificazioni</text>
  <text class="item" x="248" y="807">- Categorie</text>
  <text class="item" x="248" y="829">- Tag</text>
  <text class="item" x="248" y="851">- Settore attivita</text>

  <rect class="panel" x="430" y="715" width="360" height="220" />
  <rect class="head" x="430" y="715" width="360" height="42" />
  <text class="htext" x="450" y="742">Sponsor</text>
  <text class="labelA" x="450" y="782">Gestione contenuti</text>
  <text class="item" x="450" y="807">- Elenco sponsor</text>
  <text class="item" x="450" y="829">- Aggiungi sponsor</text>
  <line class="split" x1="610" y1="766" x2="610" y2="920" />
  <text class="labelA" x="628" y="782">Classificazioni</text>
  <text class="item" x="628" y="807">- Categorie</text>
  <text class="item" x="628" y="829">- Tag</text>

  <rect class="panel" x="810" y="715" width="360" height="220" />
  <rect class="head" x="810" y="715" width="360" height="42" />
  <text class="htext" x="830" y="742">Risorse tecniche</text>
  <text class="labelA" x="830" y="782">Gestione contenuti</text>
  <text class="item" x="830" y="807">- Elenco risorse</text>
  <text class="item" x="830" y="829">- Aggiungi risorsa</text>
  <line class="split" x1="990" y1="766" x2="990" y2="920" />
  <text class="labelA" x="1008" y="782">Classificazioni</text>
  <text class="item" x="1008" y="807">- Categorie</text>
  <text class="item" x="1008" y="829">- Tag</text>
  <text class="item" x="1008" y="851">- Tipo risorsa</text>

  <rect class="panel" x="1190" y="715" width="360" height="220" />
  <rect class="head" x="1190" y="715" width="360" height="42" />
  <text class="htext" x="1210" y="742">Configurazione</text>
  <text class="labelA" x="1210" y="782">Gestione contenuti</text>
  <text class="item" x="1210" y="807">- Configurazione</text>
  <line class="split" x1="1370" y1="766" x2="1370" y2="920" />
  <text class="labelA" x="1388" y="782">Classificazioni</text>
  <text class="item" x="1388" y="807">- Nessuna</text>

  <rect class="panel" x="50" y="955" width="1500" height="200" />
  <text class="ctitle" x="72" y="995">Nota layout</text>
  <text class="note" x="72" y="1025">Desktop: 4 colonne. Tablet: 2 colonne. Mobile: 1 colonna.</text>
  <text class="note" x="72" y="1050">Ogni card mantiene sempre la stessa struttura, quindi la distinzione tra i link resta immediata.</text>
  <text class="note" x="72" y="1075">Implementazione prevista con griglia e card Bootstrap Italia, con stili minimi dedicati.</text>
</svg>
